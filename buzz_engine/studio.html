<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buzz Pack Studio</title>
<style>
:root{
  --ground:#F3F4F8; --panel:#FFFFFF; --ink:#151A2B; --muted:#5C6378; --rule:#DCDFE8; --soft:#EEF0F5;
  --red:#D7263D; --red-ink:#FFFFFF; --red-soft:#FBE5E8;
  --blue:#2F6BE0; --orange:#EE8416; --green:#23A057; --yellow:#E2B007;
  --ok:#1E8E4E; --ok-bg:#E3F4EA; --warn:#A8620A; --warn-bg:#FCEFDB; --bad:#B42336; --bad-bg:#FBE4E7;
  --shadow:0 1px 2px rgba(21,26,43,.06),0 4px 16px rgba(21,26,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F121B; --panel:#171B27; --ink:#E8EBF3; --muted:#9BA3B7; --rule:#2A3044; --soft:#1F2434;
  --red:#F04A5E; --red-soft:#3A1B22; --blue:#6B9BFF; --orange:#F7A04B; --green:#4CC57D; --yellow:#EDC540;
  --ok:#4CC57D; --ok-bg:#16301F; --warn:#F0A54B; --warn-bg:#35270F; --bad:#FF6B7D; --bad-bg:#3A1B22;
  --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#0F121B; --panel:#171B27; --ink:#E8EBF3; --muted:#9BA3B7; --rule:#2A3044; --soft:#1F2434;
  --red:#F04A5E; --red-soft:#3A1B22; --blue:#6B9BFF; --orange:#F7A04B; --green:#4CC57D; --yellow:#EDC540;
  --ok:#4CC57D; --ok-bg:#16301F; --warn:#F0A54B; --warn-bg:#35270F; --bad:#FF6B7D; --bad-bg:#3A1B22;
  --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;margin:0;line-height:1.2;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--rule);padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px}
.buzzer{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a97,var(--red) 55%,#8e1224);box-shadow:0 3px 0 #6d0f1c;flex:none}
.brand h1{font-size:1.15rem;font-weight:800;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.plist{display:flex;flex-direction:column;gap:4px}
.plist button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px}
.plist button:hover{background:var(--soft)}
.plist button.on{background:var(--red-soft);color:var(--ink);font-weight:600}
.plist .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:.88rem}
main{padding:28px 32px 80px;display:flex;flex-direction:column;gap:22px;max-width:1080px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h2{font-size:1.9rem;font-weight:800}
.head .sub{color:var(--muted)}
.step{background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.step>header{display:flex;align-items:center;gap:12px}
.num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
.step>header h3{font-size:1.15rem;font-weight:700}
.step>header .hint{color:var(--muted);font-size:.9rem;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--ground);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;color:var(--ink);width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.go{background:var(--red);color:var(--red-ink);border:0;padding:14px 30px;font-size:1.1rem;border-radius:999px;box-shadow:0 4px 0 #7e1020}
.btn.go:active{transform:translateY(3px);box-shadow:0 1px 0 #7e1020}
.btn.go:disabled{opacity:.55;cursor:progress}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.ok{color:var(--ok);background:var(--ok-bg)} .low{color:var(--warn);background:var(--warn-bg)} .none{color:var(--bad);background:var(--bad-bg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule)}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.drop{border:2px dashed var(--rule);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--soft)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{display:flex;align-items:center;gap:8px;background:var(--ground);border:1px solid var(--rule);border-radius:10px;padding:4px 8px 4px 4px}
.ans .dot{width:22px;height:22px;border-radius:50%;flex:none}
.ans input[type=text]{border:0;background:transparent;padding:6px 2px}
.ans .cnt{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ans.correct{outline:2px solid var(--ok)}
.d0{background:var(--blue)}.d1{background:var(--orange)}.d2{background:var(--green)}.d3{background:var(--yellow)}
.cnt.over{color:var(--bad);font-weight:700}
.qtable{width:100%;border-collapse:collapse;font-size:.9rem}
.qwrap{max-height:420px;overflow:auto;border:1px solid var(--rule);border-radius:10px}
.qtable th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 10px}
.qtable td{border-top:1px solid var(--rule);padding:7px 10px;vertical-align:top}
.qtable td.a span{display:inline-block;margin:0 10px 2px 0}
.qtable td.a span:first-child{color:var(--ok);font-weight:600}
.qtable img{height:38px;border-radius:4px;vertical-align:middle;margin-right:4px}
.track{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.card{background:var(--ground);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;min-width:170px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.card .tools button{all:unset;cursor:pointer;padding:0 4px;color:var(--muted)}
.card .tools button:hover{color:var(--ink)}
.card.fixed{background:var(--soft);border-style:dashed;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:2px 9px;font-size:.8rem;cursor:pointer;background:var(--panel)}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.dim{opacity:.45;text-decoration:line-through}
.warn{color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px;font-size:.9rem}
.status{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.status div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;padding:6px 10px;border-radius:8px;background:var(--ground)}
.log{background:#0F1320;color:#D6DBEA;border-radius:10px;padding:12px 14px;font:13px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:260px;overflow:auto}
.result{border:2px solid var(--ok);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.result code{font:13px ui-monospace,Consolas,monospace;word-break:break-all}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;max-width:420px;box-shadow:var(--shadow);z-index:10}
.toast.err{background:var(--bad);color:#fff}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--red)}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--rule);position:static;height:auto;overflow:visible}main{padding:20px 16px 60px}.answers{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.themes{display:flex;flex-direction:column;gap:6px}
.bulk{display:flex;flex-direction:column;gap:8px;background:var(--ground);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="buzzer" aria-hidden="true"></div><div><h1>Buzz Pack Studio</h1><small><span data-i18n="brand.tagline"></span> <span id="ver"></span></small></div></div>
  <button class="btn" id="srvbtn" style="justify-content:space-between;display:flex;align-items:center"><span data-i18n="nav.server"></span><span class="pill" id="srvpill">…</span></button>
  <button class="btn" id="bbbtn" style="justify-content:space-between;display:flex;align-items:center"><span data-i18n="nav.buzzers"></span><span class="pill" id="bbpill">…</span></button>
  <div class="label" data-i18n="nav.packs"></div>
  <div class="plist" id="plist"></div>
  <form id="newform" class="row" style="gap:6px">
    <input type="text" id="newtitle" data-i18n-ph="nav.new_name" data-i18n-aria="nav.new_name" style="flex:1;min-width:0">
    <button class="btn primary small" type="submit" data-i18n="nav.create"></button>
  </form>
  <div class="side-foot">
    <label class="f"><span data-i18n="ui.language"></span><select id="uilang"></select></label>
    <div class="label" data-i18n="setup.title"></div>
    <label class="f"><span data-i18n="setup.rpcs3"></span><input type="text" id="rpcs3" data-i18n-ph="setup.rpcs3_ph"></label>
    <button class="btn small" id="saverpcs3" data-i18n="setup.save_folder"></button>
    <div id="gamesbox" style="margin-top:.4rem"></div>
    <div id="updbox"></div>
    <div id="ffbox"></div>
    <div id="keysbox"></div>
    <div id="hookbox"></div>
    <div id="voicebox" class="muted"></div>
  </div>
</aside>
<main id="main"><div class="empty" data-i18n="main.empty"></div></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = null, P = null, qtab = "import", addKind = "standard", qfilter = "all", qtheme = "all", job = null, lastResult = null, page = null;
const OTQA = ["general","animals","brain-teasers","celebrities","entertainment","for-kids","geography","history","hobbies","humanities","literature","movies","music","newest","people","rated","religion-faith","science-technology","sports","television","video-games","world"];
const KIND_KEYS = ["standard","picture","all_that_apply","point_stealer"];

// ---------- translations (buzz_engine/i18n/<code>.json)
let L = {}, EN = {}, LANG = "en";
function t(key, params){
  let s = L[key] ?? EN[key] ?? key;
  if(params) s = s.replace(/\{(\w+)\}/g, (m, k) => params[k] ?? m);
  return s;
}
const tn = (key, n, params) => t(key + (n === 1 ? "_one" : "_other"), Object.assign({n}, params));
const kindName = k => t("kind." + k);
const roundType = name => (S.round_types.find(r => r.name === name) || {}).type;
const rn = name => { const k = "round." + roundType(name); return (L[k] ?? EN[k]) || name; };
async function loadLang(code){
  const get = async c => { try{ const r = await fetch("/i18n/" + c + ".json"); return r.ok ? (await r.json()).ui || {} : {}; }catch(e){ return {}; } };
  EN = await get("en");
  L = code === "en" ? EN : await get(code);
  LANG = code;
  document.documentElement.lang = code;
  document.querySelectorAll("[data-i18n]").forEach(e => e.innerHTML = t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.i18nAria)));
}
function pickLang(){
  const have = (S.ui_languages || []).map(l => l.code);
  if(S.ui_lang && have.includes(S.ui_lang)) return S.ui_lang;
  const nav = (navigator.languages || [navigator.language || "en"]).map(x => x.slice(0, 2).toLowerCase());
  return nav.find(c => have.includes(c)) || "en";
}

function toast(msg, err=false){const e=$("#toast");e.textContent=msg;e.className="toast"+(err?" err":"");e.hidden=false;clearTimeout(e._h);e._h=setTimeout(()=>e.hidden=true,err?7000:3500);}
async function api(path, body){
  const r = await fetch(path, body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json(); if(!r.ok || j.error){toast(j.error||t("err.generic"), true); throw new Error(j.error);} return j;
}
// mirrors build_pack.intro_line
function introLine(about, k=0, theme=""){
  about = (about||"").trim().toUpperCase();
  const max = S.max_q_full || 115;
  if(about && "!?.;".includes(about.slice(-1))) return about.slice(0, max);
  const tp = S.intros[P.language] || S.intros.GBR;
  const ch = (about ? tp.about : (tp.theme || tp.about)), fill = about || (theme || P.topic || "").toUpperCase();
  for(let j=0;j<ch.length;j++){ const s = ch[(k+j)%ch.length].replace("%s", fill); if(s.length<=max) return s; }
  return fill.slice(0, max);
}
const themeName = id => (P.themes.find(x => x.id === id) || P.themes[0]).name;
// api() already showed the error in a toast; the rejection only stops the caller
window.addEventListener("unhandledrejection", e => e.preventDefault());
const readFile = f => new Promise(res=>{const r=new FileReader();r.onload=()=>res({name:f.name,data:r.result});r.readAsDataURL(f);});

async function loadState(){ S = await api("/api/state"); renderSide(); }
function renderSide(){
  $("#ver").textContent = S.version ? "· v" + S.version : "";
  $("#uilang").innerHTML = (S.ui_languages||[]).map(l=>`<option value="${l.code}" ${l.code===LANG?"selected":""}>${esc(l.name)}</option>`).join("");
  $("#plist").innerHTML = S.projects.length ? S.projects.map(p=>`<button class="${P&&P.id===p.id?"on":""}" data-id="${p.id}"><span>${esc(p.title)}</span><span class="n">#${p.number} · ${t("nav.q_short", {n:p.questions})}</span></button>`).join("") : `<span class="muted">${t("nav.no_packs")}</span>`;
  $("#plist").querySelectorAll("button").forEach(b=>b.onclick=()=>openProject(b.dataset.id));
  $("#rpcs3").value = S.rpcs3 || "";
  $("#hookbox").innerHTML = S.hook ? `<span class="pill ok">${t("setup.hook_on")}</span>` :
    `<button class="btn small" id="hookbtn">${t("setup.hook_btn")}</button><div class="muted" style="font-size:.8rem">${t("setup.hook_help")}</div>`;
  const hb = $("#hookbtn"); if(hb) hb.onclick = async()=>{ S = await api("/api/hook",{}); renderSide(); toast(t("setup.hook_done")); };
  const U = S.update || {};
  const gb = $("#gamesbox");
  if (gb) gb.innerHTML = !S.rpcs3 ? "" : ((S.games && S.games.length)
    ? S.games.map(g=>`<span class="pill ok">${esc(g.name)}</span>`).join(" ")
    : `<div class="muted" style="font-size:.8rem">${t("setup.no_dlc")}</div>`)
    + `<div class="muted" style="font-size:.8rem">${t("setup.quiztv")}</div>`;
  $("#updbox").innerHTML = !S.rpcs3 ? "" : U.ok ? `<span class="pill ok">${t("setup.update_ok", {v:esc(U.want)})}</span>` :
    `<div class="warn" style="font-size:.85rem">${U.installed ? t("setup.update_old", {v:esc(U.want), have:esc(U.installed)}) : t("setup.update_missing", {v:esc(U.want)})}</div>` +
    (U.downloaded ? `<button class="btn small" id="updinst">${t("setup.update_install")}</button><div class="muted" style="font-size:.8rem">${t("setup.update_install_help")}</div>`
                  : `<button class="btn small" id="upddl">${t("setup.update_download")}</button><div class="muted" style="font-size:.8rem">${t("setup.update_download_help", {v:esc(U.want)})}</div>`);
  const ud = $("#upddl"); if(ud) ud.onclick = async()=>{ ud.disabled=true; ud.textContent=t("common.downloading"); try{ S = await api("/api/update",{}); renderSide(); toast(t("setup.update_downloaded")); }catch(e){ ud.disabled=false; ud.textContent=t("setup.update_download"); } };
  const ui = $("#updinst"); if(ui) ui.onclick = async()=>{ await api("/api/update",{op:"install"}); toast(t("setup.update_opening")); };
  $("#ffbox").innerHTML = S.ffmpeg ? `<span class="pill ok">${t("setup.ffmpeg_ok")}</span>` :
    `<button class="btn small" id="ffbtn">${t("setup.ffmpeg_btn")}</button><div class="muted" style="font-size:.8rem">${t("setup.ffmpeg_help")}</div>`;
  const fb = $("#ffbtn"); if(fb) fb.onclick = async()=>{ fb.disabled=true; fb.textContent=t("common.downloading"); try{ S = await api("/api/ffmpeg",{}); renderSide(); toast(t("setup.ffmpeg_done")); }catch(e){ fb.disabled=false; fb.textContent=t("setup.ffmpeg_btn"); } };
  $("#keysbox").innerHTML = S.keys_ready ? `<span class="pill ok">${t("setup.keys_ok")}</span>` :
    `<label class="f">${t("setup.keys_label")}<input type="text" id="ebootk" placeholder="${esc(t("setup.keys_ph"))}"></label><button class="btn small" id="keysbtn">${t("setup.keys_btn")}</button><div class="muted" style="font-size:.8rem">${t("setup.keys_help")}</div>`;
  const kb = $("#keysbtn"); if(kb) kb.onclick = async()=>{ S = await api("/api/keys",{eboot:$("#ebootk").value.trim()}); renderSide(); toast(t("setup.keys_done")); };
  $("#voicebox").innerHTML = t("setup.voices", {list: S.voices.length ? S.voices.map(v=>`${esc(v.lang)}${v.trained?" "+t("setup.voice_trained"):""}`).join(", ") : t("setup.voices_none")});
}
$("#uilang").onchange = async e=>{
  S = await api("/api/settings",{ui_lang:e.target.value});
  await loadLang(e.target.value); renderSide();
  if(P){ P = await api("/api/project?id="+encodeURIComponent(P.id)); render(); }
  else if(page==="server") renderServer(); else if(page==="buzzers") renderBuzzers();
};
$("#saverpcs3").onclick = async()=>{ S = await api("/api/settings",{rpcs3:$("#rpcs3").value.trim()}); renderSide(); toast(t("setup.saved")); };
$("#newform").onsubmit = async e=>{ e.preventDefault(); const v=$("#newtitle").value.trim(); if(!v) return;
  const r = await api("/api/new",{title:v, number:S.free_number}); $("#newtitle").value=""; await loadState(); openProject(r.id); };

async function openProject(id){ page=null; P = await api("/api/project?id="+encodeURIComponent(id)); lastResult=null; qtheme="all"; renderSide(); render(); }
async function save(fields){ P = await api("/api/save", Object.assign({id:P.id}, fields)); renderRoundsStatus(); }
function totalQ(){ return P.counts.standard+P.counts.picture+P.counts.all_that_apply+P.counts.point_stealer; }

function render(){
  const m = $("#main");
  const langOpts = S.languages.map(l=>`<option value="${l.code}" ${P.language===l.code?"selected":""}>${esc(t("lang."+l.code) === "lang."+l.code ? l.name : t("lang."+l.code))} (${l.code})${l.voice?" · "+t("pack.has_voice"):""}</option>`).join("");
  m.innerHTML = `
  <div class="head"><div><h2>${esc(P.title)}</h2><div class="sub"></div></div></div>

  <section class="step"><header><span class="num">1</span><h3>${t("pack.title")}</h3><span class="hint">${t("pack.hint")}</span></header>
    <div class="grid">
      <label class="f">${t("pack.name")}<input type="text" id="f-title" value="${esc(P.title)}"></label>
      <label class="f">${t("pack.channel")}<select id="f-cat">${S.categories.map(c=>`<option value="${c}" ${P.category===c?"selected":""}>${t("channel."+c)}</option>`).join("")}</select></label>
      <label class="f">${t("pack.language")}<select id="f-lang">${langOpts}</select></label>
      <label class="f">${t("pack.author")}<input type="text" id="f-author" value="${esc(P.author)}" placeholder="${esc(t("pack.author_ph"))}"></label>
      <label class="f">${t("pack.number")}<input type="number" id="f-num" min="1" max="999" value="${P.number}"></label>
    </div>
    <div class="muted" style="font-size:.8rem">${t("pack.channel_help")}</div>
    <div id="gametarget" class="muted" style="font-size:.82rem;margin:.3rem 0"></div>
    <div class="muted" style="font-size:.8rem">${t("pack.number_help")}</div>
    <div id="numwarn"></div>

function voiceNote(){
  const l = S.languages.find(x=>x.code===P.language);
  const note = !P.audio ? t("pack.voice_off") : (l && l.voice ? t("pack.voice_on", {v:l.voice}) : t("pack.voice_none", {lang:P.language}));
  $("#voicenote").textContent = note;
  const games = (l && l.builds && l.builds.length) ? l.builds.join(" / ") : null;
  const n = (P.rounds4p||[]).length;
  $("#gosummary").textContent = `${l?t("lang."+l.code):P.language} · ${P.audio && l && l.voice ? t("g.with_voice") : t("g.no_audio")} · ${tn("g.rounds", n)}`;

  if (gt) gt.innerHTML = !l ? "" : games
    ? t("pack.plays_on", {games:esc(games), dlc:esc(l.dlc||"?")})

}

async function importFiles(list){ if(!list.length) return; const files=[]; for(const f of list) files.push(await readFile(f)); doImport({files}); }
async function doImport(body){

async function addQuestion(){

// ---------- rounds (values stay the English round names the server expects; labels are translated)
const roundNames = () => S.round_types.map(r=>r.name);
function renderTracks(){ ["4p","8p"].forEach(pl=>renderTrack(pl)); }
function renderTrack(pl){
  const steps = (P["rounds"+pl]||[]).map(s=>typeof s==="string"?s:{random:[...s.random]});
  const el = $("#track"+pl);
  const none = new Set(P.rounds_status.filter(r=>r.state==="none").map(r=>r.name));
  const opts = sel => roundNames().filter(n=>n!=="Final Countdown").map(n=>`<option value="${esc(n)}" ${n===sel?"selected":""}>${esc(rn(n))}${none.has(n)?" "+t("r.no_questions"):""}</option>`).join("");
  el.innerHTML = steps.map((s,i)=>`<div class="card" data-i="${i}"><div class="top"><span>${t("r.round_n", {n:i+1})}${typeof s==="string"?"":" · "+t("r.random")}</span><span class="tools"><button data-a="left" aria-label="${esc(t("r.earlier"))}">◀</button><button data-a="right" aria-label="${esc(t("r.later"))}">▶</button><button data-a="del" aria-label="${esc(t("r.remove"))}">✕</button></span></div>${
    typeof s==="string" ? `<select data-a="pick">${opts(s)}</select>` :
    `<div class="chips">${roundNames().filter(n=>n!=="Final Countdown").map(n=>`<span class="chip ${s.random.includes(n)?"on":""} ${none.has(n)?"dim":""}" title="${none.has(n)?esc(t("r.no_questions_help")):""}" data-a="toggle" data-n="${esc(n)}">${esc(rn(n))}</span>`).join("")}</div>`}</div>`).join("") +
    `<div class="card fixed"><div class="top"><span>${t("r.last")}</span></div><b>${esc(rn("Final Countdown"))}</b></div>
     <div class="card fixed" style="gap:6px"><button class="btn small" data-a="addr">${t("r.add_round")}</button><button class="btn small" data-a="addx">${t("r.add_random")}</button></div>`;
  $("#count"+(pl==="4p"?"4":"8")).textContent = steps.length ? tn("g.rounds", steps.length) : t("r.default");
  const commit = ns => save({["rounds"+pl]:ns}).then(()=>{renderTrack(pl); renderRoundsStatus();});
  el.querySelectorAll("[data-a]").forEach(c=>{
    const card=c.closest("[data-i]"); const i=card?+card.dataset.i:-1; const a=c.dataset.a;
    if(a==="pick") c.onchange=()=>{steps[i]=c.value; commit(steps);};
    else c.onclick=()=>{
      if(a==="del") steps.splice(i,1);
      else if(a==="left"&&i>0) [steps[i-1],steps[i]]=[steps[i],steps[i-1]];
      else if(a==="right"&&i<steps.length-1) [steps[i+1],steps[i]]=[steps[i],steps[i+1]];
      else if(a==="toggle"){ const n=c.dataset.n, r=steps[i].random; const k=r.indexOf(n); if(k>=0){ if(r.length>1) r.splice(k,1); } else r.push(n); }
      else if(a==="addr") steps.push("Point Builder");
      else if(a==="addx") steps.push({random:["Pie Fight","Pass the Bomb"]});
      commit(steps);
    };
  });
}
function renderRoundsStatus(){
  const el=$("#rstatus"); if(!el) return;
  const used = new Set([...(P.rounds4p||[]),...(P.rounds8p||[])].flatMap(s=>typeof s==="string"?[s]:s.random).concat(["Final Countdown"]));
  const bad = P.rounds_status.filter(r=>r.state==="none" && used.has(r.name)).map(r=>rn(r.name));
  $("#rwarn").innerHTML = bad.length ? `<div class="warn">${esc(tn("r.missing", bad.length, {list:bad.join(", ")}))}</div>` : "";
  el.innerHTML = P.rounds_status.map(r=>`<div style="${used.has(r.name)?"":"opacity:.6"}"><span>${esc(rn(r.name))}</span><span class="pill ${r.state}">${r.state==="none"?t("r.none"):r.questions+(r.state==="low"?" "+t("r.repeats"):"")}</span></div>`).join("");
  voiceNote();
}

// ---------- generate
function numWarn(){
  const c = P.number_conflicts || [], el = $("#numwarn"), go = $("#gobtn");
  if(el) el.innerHTML = c.length ? `<div class="warn">${c.map(esc).join("<br>")}. ${t("pack.number_pick", {n:P.free_number})}</div>` : "";
  if(go){ go.disabled = c.length>0; go.title = c.length ? t("g.need_number") : ""; }
}
async function startGenerate(){
  const btn=$("#gobtn"); btn.disabled=true; lastResult=null;
  $("#golog").innerHTML=`<div class="log" id="logbox">${t("g.starting")}</div>`;
  const r = await api("/api/generate",{id:P.id}).catch(()=>{btn.disabled=false;});
  if(!r) return;
  const poll = async()=>{
    const j = await api("/api/job?id="+r.job);
    $("#logbox").textContent = j.log.join("\n") || t("g.working");
    if(!j.done) return setTimeout(poll, 1000);
    btn.disabled=false;
    if(j.result){ lastResult=j.result; showResult(j.result); P = await api("/api/project?id="+P.id); }
  };
  poll();
}
function showResult(res){
  const box=document.createElement("div"); box.className="result";
  box.innerHTML = `<b>${t("g.ready")}</b><code>${esc(res.pkg)}</code>
    <div class="muted">${esc(res.language)} · ${t("pack.pack_no", {n:res.pack_number})} · ${tn("g.voiced", res.voiced)} · ${esc(res.voice)}</div>
    <div class="muted">${t("g.install_help")}</div>
    <div class="row"><button class="btn" id="openf">${t("g.open_folder")}</button><button class="btn" id="inst">${t("g.install")}</button></div>`;
  $("#golog").appendChild(box);
  $("#openf").onclick=()=>api("/api/open",{path:res.pkg});
  $("#inst").onclick=async()=>{const r=await api("/api/install",{result:res});
    toast(t("g.installed", {game:r.game_name||r.dlc_title, path:r.installed}));};
}

// ---------- online server page
let srvTimer = null;
async function srvPill(){ try{ const st = await api("/api/server",{op:"status"}); const p=$("#srvpill"); p.textContent = st.running?t("srv.running_short"):t("srv.stopped_short"); p.className = "pill "+(st.running?"ok":"none"); return st; }catch(e){} }
$("#srvbtn").onclick = ()=>{ P=null; page="server"; renderSide(); renderServer(); };
async function renderServer(st){
  st = st || await api("/api/server",{op:"status"});
  srvPill();
  const m=$("#main");
  const swap = `${st.hostname}=${st.lan_ip}`;
  m.innerHTML = `
  <div class="head"><div><h2>${t("srv.title")}</h2><div class="sub">${t("srv.sub")}</div></div></div>
  <section class="step"><header><h3>${t("srv.server")}</h3><span class="hint"><span class="pill ${st.running?"ok":"none"}">${st.running?t("srv.running"):t("srv.stopped")}</span></span></header>
    ${st.configured ? "" : `<div class="warn">${t("srv.setup_help")}</div>
      <label class="f">${t("srv.eboot")}<div class="row"><input type="text" id="eboot" placeholder="…\\EBOOT.elf" style="flex:1"><button class="btn primary" id="setupbtn">${t("srv.setup_btn")}</button></div></label>`}
    <div class="row">${st.running ? `<button class="btn" id="stopbtn" ${st.managed?"":`disabled title="${esc(t("srv.outside"))}"`}>${t("srv.stop")}</button>` : `<button class="btn primary" id="startbtn" ${st.configured?"":"disabled"}>${t("srv.start")}</button>`}
      <span class="muted">${t("srv.ports")} ${Object.entries(st.ports).map(([p,u])=>`${p} ${u?"✓":"✗"}`).join(" · ")}</span></div>
    <div class="log">${esc((st.log||[]).join("\n")) || t("srv.no_log")}</div>
  </section>
  <section class="step"><header><h3>${t("srv.friends")}</h3><span class="hint">${t("srv.friends_hint")}</span></header>
    <div>${t("srv.swap_help", {self:`<code>${esc(st.hostname)}=127.0.0.1</code>`})}</div>
    <div class="row"><code style="font-size:1rem;padding:6px 10px;background:var(--soft);border-radius:8px">${esc(swap)}</code><button class="btn small" id="copyswap">${t("srv.copy")}</button></div>
    <div class="muted">${t("srv.internet")}</div>
    <div class="grid" style="align-items:end">
      <label class="f">${t("srv.this_pc")}<input type="text" id="srvip" value="127.0.0.1"></label>
      <label class="switch"><input type="checkbox" id="fps60" checked> ${t("srv.fps60")}</label>
      <button class="btn primary" id="setuppc">${t("srv.setup_pc")}</button>
    </div>
    <div class="muted" style="font-size:.85rem">${t("srv.setup_pc_help")}</div>
    <div id="setupres"></div>
  </section>
  <section class="step"><header><h3>${t("srv.quizzes")}</h3><span class="hint">${t("srv.quizzes_hint")}</span></header>
    <div class="qwrap"><table class="qtable"><thead><tr><th>${t("srv.col_pack")}</th><th>${t("srv.col_quizzes")}</th><th>${t("srv.col_from")}</th><th>${t("srv.col_on")}</th></tr></thead><tbody>${
      (st.published||[]).map(p=>`<tr><td>${esc(p.pack)}</td><td>${p.quizzes}</td><td class="muted">${p.project?t("srv.from_studio", {name:esc(p.project)}):t("srv.from_file", {name:esc(p.file)})}</td><td><input type="checkbox" data-file="${esc(p.file)}" ${p.enabled?"checked":""} aria-label="${esc(t("srv.offer", {name:p.pack}))}"></td></tr>`).join("") || `<tr><td colspan="4" class="muted">${t("srv.nothing")}</td></tr>`}</tbody></table></div>
  </section>`;
  const b=(id,fn)=>{const e=$("#"+id); if(e) e.onclick=fn;};
  b("startbtn", async()=>{ renderServer(await api("/api/server",{op:"start"})); setTimeout(()=>renderServer(),2500); });
  b("stopbtn", async()=>renderServer(await api("/api/server",{op:"stop"})));
  b("setupbtn", async()=>{ renderServer(await api("/api/server",{op:"setup",eboot:$("#eboot").value.trim()})); toast(t("srv.set_up")); });
  b("copyswap", ()=>{ navigator.clipboard.writeText(swap); toast(t("srv.copied")); });
  b("setuppc", async()=>{ const r=await api("/api/setup_pc",{server_ip:$("#srvip").value.trim(),fps60:$("#fps60").checked}); $("#setupres").innerHTML=`<div class="result"><b>${t("srv.done")}</b>${r.done.map(x=>`<div>✓ ${esc(x)}</div>`).join("")}<div class="muted">${t("srv.restart")}</div></div>`; });
  m.querySelectorAll("[data-file]").forEach(c=>c.onchange=()=>api("/api/catalog",{file:c.dataset.file,enabled:c.checked}));
  clearTimeout(srvTimer); srvTimer=setTimeout(()=>{ if(page==="server") renderServer(); }, 5000);
}

let bbTimer;
async function bbPill(){ try{ const st = await api("/api/buzzers",{op:"status"}); const p=$("#bbpill"); p.textContent = st.running?t("bb.on_short"):t("bb.off_short"); p.className = "pill "+(st.running?"ok":"none"); return st; }catch(e){} }
$("#bbbtn").onclick = ()=>{ P=null; page="buzzers"; renderSide(); renderBuzzers(); };
const BB_RECEIVER = {ok:1, running:1, missing:0, no_driver:0, no_library:0};
async function renderBuzzers(st){
  st = st || await api("/api/buzzers",{op:"status"});
  bbPill();
  const tick=(ok,s)=>`<div>${ok?"✓":"✗"} ${esc(s)}</div>`;
  const rc = st.receiver in BB_RECEIVER ? [BB_RECEIVER[st.receiver], t("bb.rx_"+st.receiver)] : [0, st.receiver];
  $("#main").innerHTML = `
  <div class="head"><div><h2>${t("bb.title")}</h2><div class="sub">${t("bb.sub")}</div></div></div>
  <section class="step"><header><h3>${t("bb.buzzers")}</h3><span class="hint"><span class="pill ${st.running?"ok":"none"}">${st.running?t("srv.running"):t("srv.stopped")}</span></span></header>
    <label class="switch"><input type="checkbox" id="bbtoggle" ${st.running?"checked":""}> ${t("bb.toggle")}</label>
    <div>${tick(rc[0], rc[1])}${st.titles.length ? tick(1, t("bb.profile", {list:st.titles.join(", ")})) : tick(0, t("bb.no_profile"))}${st.mapped.length ? tick(1, t("bb.mapped", {list:st.mapped.join(", ")})) : `<div class="muted">${t("bb.map_on_start")}</div>`}</div>
    <div class="muted">${t("bb.focus")}</div>
    <div class="log">${esc((st.log||[]).join("\n")) || t("bb.no_log")}</div>
  </section>
  <section class="step"><header><h3>${t("bb.how")}</h3><span class="hint">${t("bb.how_hint")}</span></header>
    <ol><li>${t("bb.how1")}</li><li>${t("bb.how2")}</li><li>${t("bb.how3")}</li><li>${t("bb.how4")}</li></ol>
    <div class="qwrap"><table class="qtable"><thead><tr><th>${t("bb.col_pad")}</th><th>${t("bb.col_buzzer")}</th></tr></thead><tbody>
      <tr><td>${t("bb.big")}</td><td>${t("bb.red")}</td></tr><tr><td>${t("bb.x")}</td><td>${t("bb.blue")}</td></tr><tr><td>${t("bb.b")}</td><td>${t("bb.orange")}</td></tr>
      <tr><td>${t("bb.a")}</td><td>${t("bb.green")}</td></tr><tr><td>${t("bb.y")}</td><td>${t("bb.yellow")}</td></tr><tr><td>${t("bb.menu_btns")}</td><td>${t("bb.menus")}</td></tr>
    </tbody></table></div>
  </section>`;
  $("#bbtoggle").onchange = async e=>{
    try{ renderBuzzers(await api("/api/buzzers",{op: e.target.checked?"start":"stop"})); }
    catch(err){ renderBuzzers(); }
  };
  clearTimeout(bbTimer); bbTimer=setTimeout(()=>{ if(page==="buzzers") renderBuzzers(); }, 2000);
}

(async()=>{
  S = await api("/api/state");
  await loadLang(pickLang());
  renderSide(); srvPill(); bbPill();
  const u=new URLSearchParams(location.search); const q=u.get("p");
  if(q) openProject(q); else if(u.get("page")==="server"){ page="server"; renderServer(); } else if(u.get("page")==="buzzers"){ page="buzzers"; renderBuzzers(); }
})();
</script>
